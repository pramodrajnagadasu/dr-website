; GoDaddy shared hosting — PHP session configuration
; Creates a sessions folder inside your site directory
session.save_path = "sessions"
session.gc_maxlifetime = 3600

; Don't show errors (stack traces, DB credentials, file paths) to visitors —
; log them instead. Changes here take effect within a few minutes
; (user_ini.cache_ttl) without needing a server restart.
display_errors = Off
log_errors = On
error_log = "error_log"
